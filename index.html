<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<title>欠交作业名单</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#f7f6f2;
    --paper:#ffffff;
    --ink:#20211f;
    --muted:#777971;
    --line:#deddd7;
    --danger:#b74432;
    --danger-deep:#8e3125;
    --danger-soft:#fbefec;
    --ok:#46735a;
    --ok-soft:#eef5f0;
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  button,input{font:inherit;}

  .page{
    width:min(100%,760px);
    margin:0 auto;
    padding:28px 18px calc(48px + env(safe-area-inset-bottom));
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:18px;
    padding-bottom:20px;
    border-bottom:1px solid var(--line);
  }

  h1{
    margin:0;
    font-size:34px;
    line-height:1.08;
    letter-spacing:-.04em;
    font-weight:900;
  }

  .updated{
    flex:none;
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
    text-align:right;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .search-wrap{
    position:relative;
    margin-top:18px;
  }

  .search-icon{
    position:absolute;
    left:15px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:var(--muted);
    pointer-events:none;
  }

  .search{
    width:100%;
    height:50px;
    padding:0 44px 0 44px;
    border:1px solid var(--line);
    border-radius:12px;
    outline:none;
    background:var(--paper);
    color:var(--ink);
    font-size:16px;
    transition:border-color .16s ease, box-shadow .16s ease;
  }

  .search::placeholder{color:#a0a19d;}
  .search:focus{
    border-color:#bd8f86;
    box-shadow:0 0 0 3px rgba(183,68,50,.08);
  }

  .clear{
    display:none;
    position:absolute;
    top:50%;
    right:7px;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    font-size:22px;
    line-height:1;
  }
  .clear.show{display:block;}

  .summary{
    margin:23px 0 8px;
    font-size:15px;
    color:var(--muted);
  }
  .summary strong{
    color:var(--danger-deep);
    font-size:18px;
    font-weight:900;
  }

  .list{
    border-top:1px solid var(--line);
  }

  .student{
    padding:18px 1px 19px;
    border-bottom:1px solid var(--line);
  }

  .student-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
  }

  .student-name{
    min-width:0;
    font-size:21px;
    line-height:1.2;
    font-weight:850;
    letter-spacing:-.015em;
  }

  .count{
    flex:none;
    color:var(--danger-deep);
    font-size:14px;
    font-weight:850;
    white-space:nowrap;
  }

  .student-id{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
    font-variant-numeric:tabular-nums;
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:12px;
  }

  .tag{
    display:inline-block;
    padding:5px 8px;
    border:1px solid #edc7bf;
    border-radius:7px;
    background:var(--danger-soft);
    color:var(--danger-deep);
    font-size:13px;
    font-weight:700;
    line-height:1.15;
  }

  .search-result{
    display:none;
    margin-top:18px;
    padding:18px 0 2px;
    border-top:1px solid var(--line);
  }
  .search-result.show{display:block;}

  .result-name{
    font-size:24px;
    font-weight:900;
    letter-spacing:-.02em;
  }
  .result-id{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
  }
  .result-status{
    margin-top:16px;
    font-size:16px;
    font-weight:850;
  }
  .result-status.missing{color:var(--danger-deep);}
  .result-status.clean{color:var(--ok);}
  .result-tags{margin-top:10px;}

  .no-match{
    color:var(--muted);
    font-size:14px;
  }

  .all-clear{
    margin-top:25px;
    padding:24px 0 10px;
    border-top:1px solid var(--line);
    text-align:center;
  }
  .all-clear-title{
    color:var(--ok);
    font-size:24px;
    font-weight:900;
  }
  .all-clear-sub{
    margin-top:7px;
    color:var(--muted);
    font-size:13px;
  }

  .loading,
  .error{
    margin-top:24px;
    padding:22px 0;
    border-top:1px solid var(--line);
    color:var(--muted);
    font-size:14px;
  }
  .error{color:var(--danger-deep);}
  .retry{
    margin-top:12px;
    border:1px solid #d9ada5;
    border-radius:9px;
    background:var(--paper);
    color:var(--danger-deep);
    padding:8px 12px;
    font-weight:750;
    cursor:pointer;
  }

  .sync{
    margin-top:26px;
    color:#a1a29d;
    font-size:11px;
    text-align:center;
    min-height:16px;
  }

  @media (max-width:520px){
    .page{padding:22px 16px calc(42px + env(safe-area-inset-bottom));}
    header{padding-bottom:17px;}
    h1{font-size:30px;}
    .updated{font-size:11px;margin-top:3px;}
    .search-wrap{margin-top:15px;}
    .search{height:48px;font-size:15px;}
    .summary{margin-top:20px;}
    .student{padding:16px 1px 17px;}
    .student-name{font-size:20px;}
    .tag{font-size:12px;}
  }

  @media (max-width:360px){
    h1{font-size:27px;}
    .student-head{gap:10px;}
    .count{font-size:13px;}
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>欠交作业名单</h1>
    <div class="updated" id="updated">读取中…</div>
  </header>

  <div class="search-wrap" id="searchWrap" hidden>
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
      <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </svg>
    <input class="search" id="searchBox" type="search" autocomplete="off" placeholder="搜索姓名或学号" aria-label="搜索姓名或学号">
    <button class="clear" id="clearBtn" type="button" aria-label="清除搜索">×</button>
  </div>

  <section class="search-result" id="searchResult"></section>

  <div id="content">
    <div class="loading">正在读取最新资料…</div>
  </div>

  <div class="sync" id="syncStatus"></div>
</main>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSq3d_gGcqriERDsZ6PqA4rywIgqw4I6Irt8t18Znd9it1KLcUegNilD8P3T0XA0SaTATECA4L4X2PZ/pub?gid=841459666&single=true&output=csv';

let students = [];
let assignmentCols = [];

const updatedEl = document.getElementById('updated');
const contentEl = document.getElementById('content');
const searchWrap = document.getElementById('searchWrap');
const searchBox = document.getElementById('searchBox');
const searchResult = document.getElementById('searchResult');
const clearBtn = document.getElementById('clearBtn');
const syncStatus = document.getElementById('syncStatus');

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function isDone(value){
  if(value === undefined || value === null) return false;
  const s = String(value).trim().toLowerCase();
  if(!s) return false;
  const doneSet = ['✅','✓','true','yes','y','是','有','1','对','✔','✔️'];
  const noSet = ['❌','✗','false','no','n','否','没有','0','x','✘','没交','缺'];
  if(doneSet.includes(s)) return true;
  if(noSet.includes(s)) return false;
  if(s.includes('✅') || s.includes('✓') || s.includes('✔')) return true;
  if(s.includes('❌') || s.includes('✗') || s.includes('✘')) return false;
  return true;
}

function parseRows(rows){
  if(rows.length < 2) throw new Error('资料不足');
  const header = rows[0].map(v => String(v ?? '').trim());
  if(header.length < 3) throw new Error('找不到作业栏位');

  assignmentCols = header.slice(2);
  const result = [];

  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    if(!row || row.every(v => !String(v ?? '').trim())) continue;

    const id = String(row[0] ?? '').trim();
    const name = String(row[1] ?? '').trim();
    if(!id && !name) continue;

    const missing = [];
    for(let c = 0; c < assignmentCols.length; c++){
      if(!isDone(row[c + 2])) missing.push(assignmentCols[c]);
    }

    result.push({ id, name, missing, total: assignmentCols.length });
  }

  return result;
}

function formatUpdateTime(date){
  const month = date.getMonth() + 1;
  const day = date.getDate();
  const hh = String(date.getHours()).padStart(2,'0');
  const mm = String(date.getMinutes()).padStart(2,'0');
  return `${month}月${day}日 · ${hh}:${mm}`;
}

function missingCard(student){
  return `
    <article class="student">
      <div class="student-head">
        <div class="student-name">${escapeHtml(student.name)}</div>
        <div class="count">欠 ${student.missing.length} 项</div>
      </div>
      <div class="student-id">${escapeHtml(student.id)}</div>
      <div class="tags">
        ${student.missing.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('')}
      </div>
    </article>`;
}

function renderPublicList(){
  const missing = students
    .filter(s => s.missing.length > 0)
    .sort((a,b) => b.missing.length - a.missing.length || a.id.localeCompare(b.id));

  if(missing.length === 0){
    contentEl.innerHTML = `
      <section class="all-clear">
        <div class="all-clear-title">✓ 全部交齐</div>
        <div class="all-clear-sub">目前没有学生欠交作业</div>
      </section>`;
    return;
  }

  contentEl.innerHTML = `
    <div class="summary">目前 <strong>${missing.length}</strong> 人欠交</div>
    <section class="list">
      ${missing.map(missingCard).join('')}
    </section>`;
}

function renderSearch(){
  const q = searchBox.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', Boolean(q));

  if(!q){
    searchResult.classList.remove('show');
    searchResult.innerHTML = '';
    contentEl.hidden = false;
    return;
  }

  const matches = students.filter(s =>
    s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)
  );

  contentEl.hidden = true;
  searchResult.classList.add('show');

  if(matches.length === 0){
    searchResult.innerHTML = `<div class="no-match">没有找到符合的姓名或学号。</div>`;
    return;
  }

  searchResult.innerHTML = matches.map(s => {
    const hasMissing = s.missing.length > 0;
    return `
      <section class="student" style="padding-top:0">
        <div class="student-head">
          <div>
            <div class="result-name">${escapeHtml(s.name)}</div>
            <div class="result-id">${escapeHtml(s.id)}</div>
          </div>
          <div class="result-status ${hasMissing ? 'missing' : 'clean'}">
            ${hasMissing ? `欠 ${s.missing.length} 项` : '✓ 全部完成'}
          </div>
        </div>
        ${hasMissing ? `<div class="tags result-tags">${s.missing.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>` : ''}
      </section>`;
  }).join('');
}

function loadFromSheet(){
  updatedEl.textContent = '读取中…';
  syncStatus.textContent = '';
  searchWrap.hidden = true;
  searchResult.classList.remove('show');
  contentEl.hidden = false;
  contentEl.innerHTML = `<div class="loading">正在读取最新资料…</div>`;

  fetch(SHEET_CSV_URL + '&cachebust=' + Date.now())
    .then(res => {
      if(!res.ok) throw new Error(`网络错误 ${res.status}`);
      return res.text();
    })
    .then(text => {
      const parsed = Papa.parse(text.trim(), {delimiter: ','});
      students = parseRows(parsed.data);
      const now = new Date();
      updatedEl.textContent = formatUpdateTime(now);
      syncStatus.textContent = `资料已更新 · ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      searchWrap.hidden = false;
      renderPublicList();
      renderSearch();
    })
    .catch(err => {
      updatedEl.textContent = '更新失败';
      contentEl.innerHTML = `
        <div class="error">
          暂时无法读取最新资料。
          <br><button class="retry" type="button" onclick="loadFromSheet()">重新读取</button>
        </div>`;
      console.error(err);
    });
}

searchBox.addEventListener('input', renderSearch);
clearBtn.addEventListener('click', () => {
  searchBox.value = '';
  searchBox.focus();
  renderSearch();
});

window.addEventListener('DOMContentLoaded', loadFromSheet);
</script>
</body>
</html>
