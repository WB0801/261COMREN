<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f0eb">
<title>欠交作业名单</title>
<link rel="icon" type="image/png" sizes="32x32" href="./mrblue-icon-v1-32.png?v=mrblue-20261116">
<link rel="apple-touch-icon" sizes="180x180" href="./mrblue-icon-v1-180.png?v=mrblue-20261116">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#f2f0eb;
    --surface:#fbfaf7;
    --surface-strong:#ffffff;
    --ink:#191b1a;
    --muted:#797b76;
    --line:#dedbd3;
    --danger:#a93f30;
    --danger-deep:#7f2c22;
    --danger-soft:#f8ebe7;
    --ok:#416a52;
    --ok-soft:#eaf2ed;
    --shadow:0 10px 34px rgba(34,31,27,.055);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    color:var(--ink);
    background:
      radial-gradient(circle at 12% -10%, rgba(169,63,48,.055), transparent 30%),
      radial-gradient(circle at 100% 18%, rgba(65,106,82,.035), transparent 26%),
      var(--bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  button,input{font:inherit;}

  .page{
    width:min(100%,860px);
    margin:0 auto;
    padding:34px 22px calc(56px + env(safe-area-inset-bottom));
  }

  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:24px;
  }

  .title-wrap{
    display:flex;
    align-items:center;
    gap:13px;
    min-width:0;
  }

  .title-mark{
    width:6px;
    height:34px;
    border-radius:999px;
    background:var(--danger);
    box-shadow:0 6px 14px rgba(169,63,48,.18);
    flex:none;
  }

  h1{
    margin:0;
    font-size:40px;
    line-height:1;
    letter-spacing:-.055em;
    font-weight:900;
  }

  .updated{
    flex:none;
    color:var(--muted);
    font-size:12px;
    line-height:1;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    padding-bottom:4px;
  }

  .search-wrap{
    position:relative;
    margin-bottom:22px;
  }

  .search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    color:#898b86;
    pointer-events:none;
  }

  .search{
    width:100%;
    height:56px;
    padding:0 48px 0 48px;
    border:1px solid rgba(201,197,188,.9);
    border-radius:18px;
    outline:none;
    background:rgba(255,255,255,.82);
    color:var(--ink);
    font-size:16px;
    box-shadow:0 6px 24px rgba(34,31,27,.035);
    backdrop-filter:blur(8px);
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  .search::placeholder{color:#999b96;}
  .search:focus{
    border-color:rgba(169,63,48,.46);
    background:#fff;
    box-shadow:0 8px 28px rgba(34,31,27,.06), 0 0 0 4px rgba(169,63,48,.055);
  }

  .clear{
    display:none;
    position:absolute;
    top:50%;
    right:10px;
    transform:translateY(-50%);
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:transparent;
    color:#8a8b86;
    cursor:pointer;
    font-size:22px;
    line-height:1;
  }
  .clear.show{display:block;}
  .clear:hover{background:#f1efea;}

  .summary{
    display:flex;
    align-items:center;
    gap:9px;
    margin:2px 2px 14px;
    color:var(--muted);
    font-size:14px;
  }
  .summary::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 0 5px rgba(169,63,48,.08);
    flex:none;
  }
  .summary strong{
    color:var(--ink);
    font-size:17px;
    font-weight:850;
  }

  .list{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  }

  .student{
    position:relative;
    min-width:0;
    padding:20px 20px 18px;
    border:1px solid rgba(211,207,198,.92);
    border-radius:18px;
    background:rgba(255,255,255,.72);
    box-shadow:var(--shadow);
    overflow:hidden;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }

  .student::before{
    content:"";
    position:absolute;
    left:0;
    top:18px;
    bottom:18px;
    width:3px;
    border-radius:0 999px 999px 0;
    background:var(--danger);
    opacity:.9;
  }

  .student.clean::before{background:var(--ok);}

  @media (hover:hover){
    .student:hover{
      transform:translateY(-1px);
      border-color:#cbc6bc;
      box-shadow:0 14px 38px rgba(34,31,27,.075);
    }
  }

  .student-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:14px;
  }

  .identity{min-width:0;}

  .student-name{
    font-size:24px;
    line-height:1.15;
    font-weight:900;
    letter-spacing:-.025em;
    word-break:break-word;
  }

  .student-id{
    margin-top:6px;
    color:var(--muted);
    font-size:12px;
    font-variant-numeric:tabular-nums;
    letter-spacing:.03em;
  }

  .count{
    flex:none;
    margin-top:1px;
    padding:6px 9px;
    border-radius:999px;
    background:var(--danger-soft);
    color:var(--danger-deep);
    border:1px solid #edc8c0;
    font-size:12px;
    line-height:1;
    font-weight:850;
    white-space:nowrap;
  }

  .count.clean{
    color:var(--ok);
    background:var(--ok-soft);
    border-color:#c9ddd0;
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:17px;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    min-height:29px;
    padding:5px 9px;
    border-radius:9px;
    background:#f7f3ef;
    color:#5e403a;
    border:1px solid #ead6d0;
    font-size:12px;
    font-weight:700;
    line-height:1.15;
  }

  .clean-note{
    margin-top:17px;
    color:var(--ok);
    font-size:13px;
    font-weight:700;
  }

  .all-clear{
    padding:34px 24px;
    border:1px solid #cddbd2;
    border-radius:18px;
    background:rgba(250,253,251,.8);
    text-align:center;
    box-shadow:var(--shadow);
  }
  .all-clear-title{
    color:var(--ok);
    font-size:25px;
    font-weight:900;
    letter-spacing:-.02em;
  }

  .no-match,
  .error{
    padding:28px 22px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(255,255,255,.58);
    color:var(--muted);
    font-size:14px;
    text-align:center;
  }

  .error{color:var(--danger-deep);}
  .retry{
    margin-top:12px;
    border:1px solid #d9ada5;
    border-radius:10px;
    background:#fff;
    color:var(--danger-deep);
    padding:8px 12px;
    font-weight:750;
    cursor:pointer;
  }

  .skeleton-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:14px;
  }
  .skeleton{
    height:130px;
    border:1px solid rgba(211,207,198,.8);
    border-radius:18px;
    background:linear-gradient(100deg, rgba(255,255,255,.52) 20%, rgba(255,255,255,.92) 40%, rgba(255,255,255,.52) 60%);
    background-size:220% 100%;
    animation:shimmer 1.25s infinite linear;
  }
  @keyframes shimmer{to{background-position-x:-220%;}}

  @media (max-width:680px){
    .page{padding:26px 16px calc(46px + env(safe-area-inset-bottom));}
    header{margin-bottom:19px;align-items:flex-start;}
    .title-mark{height:30px;width:5px;margin-top:1px;}
    h1{font-size:32px;letter-spacing:-.05em;}
    .updated{font-size:11px;padding-top:4px;padding-bottom:0;}
    .search-wrap{margin-bottom:18px;}
    .search{height:52px;border-radius:15px;font-size:15px;}
    .summary{margin-bottom:12px;}
    .list,.skeleton-grid{grid-template-columns:1fr;gap:10px;}
    .student{padding:17px 17px 16px;border-radius:15px;box-shadow:0 8px 26px rgba(34,31,27,.045);}
    .student::before{top:16px;bottom:16px;}
    .student-name{font-size:22px;}
    .tags{margin-top:14px;}
  }

  @media (max-width:380px){
    h1{font-size:29px;}
    .title-wrap{gap:10px;}
    .updated{font-size:10.5px;}
    .student-head{gap:10px;}
    .count{padding:6px 8px;}
  }
</style>
</head>
<body>
<main class="page">
  <header>
    <div class="title-wrap">
      <span class="title-mark" aria-hidden="true"></span>
      <h1>欠交作业名单</h1>
    </div>
    <div class="updated" id="updated">读取中…</div>
  </header>

  <div class="search-wrap" id="searchWrap" hidden>
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"></circle>
      <path d="M16 16L20 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
    </svg>
    <input class="search" id="searchBox" type="search" autocomplete="off" placeholder="搜索姓名或学号" aria-label="搜索姓名或学号">
    <button class="clear" id="clearBtn" type="button" aria-label="清除搜索">×</button>
  </div>

  <div id="content">
    <div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div></div>
  </div>
</main>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSq3d_gGcqriERDsZ6PqA4rywIgqw4I6Irt8t18Znd9it1KLcUegNilD8P3T0XA0SaTATECA4L4X2PZ/pub?gid=841459666&single=true&output=csv';

let students = [];
let assignmentCols = [];

const updatedEl = document.getElementById('updated');
const contentEl = document.getElementById('content');
const searchWrap = document.getElementById('searchWrap');
const searchBox = document.getElementById('searchBox');
const clearBtn = document.getElementById('clearBtn');

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function isDone(value){
  if(value === undefined || value === null) return false;
  const s = String(value).trim().toLowerCase();
  if(!s) return false;
  const doneSet = ['✅','✓','true','yes','y','是','有','1','对','✔','✔️'];
  const noSet = ['❌','✗','false','no','n','否','没有','0','x','✘','没交','缺'];
  if(doneSet.includes(s)) return true;
  if(noSet.includes(s)) return false;
  if(s.includes('✅') || s.includes('✓') || s.includes('✔')) return true;
  if(s.includes('❌') || s.includes('✗') || s.includes('✘')) return false;
  return true;
}

function parseRows(rows){
  if(rows.length < 2) throw new Error('资料不足');
  const header = rows[0].map(v => String(v ?? '').trim());
  if(header.length < 3) throw new Error('找不到作业栏位');

  assignmentCols = header.slice(2);
  const result = [];

  for(let i = 1; i < rows.length; i++){
    const row = rows[i];
    if(!row || row.every(v => !String(v ?? '').trim())) continue;

    const id = String(row[0] ?? '').trim();
    const name = String(row[1] ?? '').trim();
    if(!id && !name) continue;

    const missing = [];
    for(let c = 0; c < assignmentCols.length; c++){
      if(!isDone(row[c + 2])) missing.push(assignmentCols[c]);
    }

    result.push({ id, name, missing });
  }
  return result;
}

function formatUpdateTime(date){
  const month = date.getMonth() + 1;
  const day = date.getDate();
  const hh = String(date.getHours()).padStart(2,'0');
  const mm = String(date.getMinutes()).padStart(2,'0');
  return `${month}月${day}日 · ${hh}:${mm}`;
}

function studentCard(student, showClean=false){
  const hasMissing = student.missing.length > 0;
  return `
    <article class="student ${hasMissing ? '' : 'clean'}">
      <div class="student-head">
        <div class="identity">
          <div class="student-name">${escapeHtml(student.name)}</div>
          <div class="student-id">${escapeHtml(student.id)}</div>
        </div>
        <div class="count ${hasMissing ? '' : 'clean'}">${hasMissing ? `欠 ${student.missing.length} 项` : '已完成'}</div>
      </div>
      ${hasMissing
        ? `<div class="tags">${student.missing.map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('')}</div>`
        : (showClean ? `<div class="clean-note">目前没有欠交作业</div>` : '')}
    </article>`;
}

function render(){
  const q = searchBox.value.trim().toLowerCase();
  clearBtn.classList.toggle('show', Boolean(q));

  if(q){
    const matches = students.filter(s =>
      s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)
    );

    if(matches.length === 0){
      contentEl.innerHTML = `<div class="no-match">没有找到符合的姓名或学号</div>`;
      return;
    }

    contentEl.innerHTML = `<section class="list">${matches.map(s => studentCard(s, true)).join('')}</section>`;
    return;
  }

  const missing = students
    .filter(s => s.missing.length > 0)
    .sort((a,b) => b.missing.length - a.missing.length || a.id.localeCompare(b.id));

  if(missing.length === 0){
    contentEl.innerHTML = `<section class="all-clear"><div class="all-clear-title">✓ 全部交齐</div></section>`;
    return;
  }

  contentEl.innerHTML = `
    <div class="summary"><strong>${missing.length} 人</strong> 欠交</div>
    <section class="list">${missing.map(s => studentCard(s)).join('')}</section>`;
}

function loadFromSheet(){
  updatedEl.textContent = '读取中…';
  searchWrap.hidden = true;
  contentEl.innerHTML = `<div class="skeleton-grid"><div class="skeleton"></div><div class="skeleton"></div></div>`;

  fetch(SHEET_CSV_URL + '&cachebust=' + Date.now())
    .then(res => {
      if(!res.ok) throw new Error(`网络错误 ${res.status}`);
      return res.text();
    })
    .then(text => {
      const parsed = Papa.parse(text.trim(), {delimiter: ','});
      students = parseRows(parsed.data);
      updatedEl.textContent = formatUpdateTime(new Date());
      searchWrap.hidden = false;
      render();
    })
    .catch(err => {
      updatedEl.textContent = '更新失败';
      contentEl.innerHTML = `
        <div class="error">
          暂时无法读取最新资料<br>
          <button class="retry" type="button" onclick="loadFromSheet()">重新读取</button>
        </div>`;
      console.error(err);
    });
}

searchBox.addEventListener('input', render);
clearBtn.addEventListener('click', () => {
  searchBox.value = '';
  searchBox.focus();
  render();
});

window.addEventListener('DOMContentLoaded', loadFromSheet);
</script>
</body>
</html>
